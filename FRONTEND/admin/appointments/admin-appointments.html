<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Appointments</title>
    <link rel="stylesheet" href="admin-appointments.css">
    <link rel="stylesheet" href="../admin-shell.css">
    <link rel="stylesheet" href="../../confirm-toast/confirm.css">
    <link rel="stylesheet" href="../../confirm-toast/toast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.jpg">
</head>
<body class="admin-portal">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            
            <!-- Logo -->
            <div class="sidebar-logo">
                <a href="../../homepage/homepage.html">
                    <img src="../../assets/Hospital-logo-without-bcg.jpg" alt="CityCare Hospital">
                </a>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-menu">

                <a href="../dashboard/admin-dashboard.html" class="menu-item">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Dashboard</span>
                </a>

                <a href="../doctors/admin-doctor.html" class="menu-item">
                    <i class="fa-solid fa-user-doctor"></i>
                    <span>Doctors</span>
                </a>

                <a href="../patients/admin-patient.html" class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Patients</span>
                </a>

                <a href="admin-appointments.html" class="menu-item active">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Appointments</span>
                </a>
                <a href="../queue/admin-patient-queue.html" class="menu-item">
                    <i class="fa-solid fa-list-ol"></i>
                    <span>Patient Queue</span>
                </a>
            </nav>

            <!-- Divider -->
            <div class="sidebar-divider"></div>

            <!-- Logout -->
            <div class="sidebar-logout">
                <a href="#" id="logoutBtn" class="menu-item">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>

        </aside>


        <main class="main-content">
            <header class="dashboard-header">

                <div class="profile-breadcrumb">
                    <h1>APPOINTMENTS</h1>
                    <p id="appointmentCount"></p>
                </div>
            
                <div class="header-right">
                    <div class="profile-menu">
                        <div class="profile-avatar" id="profileAvatar"></div>
                        <span id="adminName">Admin User</span>
                    </div>
                </div>
            
            </header>

            <section class="appointment-management">

                <div class="appointment-filters">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="searchAppointment" placeholder="Search patient or doctor" aria-label="Search by patient or doctor">
                    </div>
                    <label class="appointment-filter" for="appointmentStatusFilter">
                        <span>Status</span>
                        <select id="appointmentStatusFilter">
                            <option value="all">All statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </label>
                    <label class="appointment-filter" for="appointmentDateFilter">
                        <span>Date</span>
                        <input type="date" id="appointmentDateFilter">
                    </label>
                    <label class="appointment-filter" for="appointmentSort">
                        <span>Sort by date &amp; time</span>
                        <select id="appointmentSort">
                            <option value="asc">Earliest first</option>
                            <option value="desc">Latest first</option>
                        </select>
                    </label>
                    <button type="button" class="clear-filters-btn" id="clearAppointmentFilters">
                        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                        Clear Filters
                    </button>
                </div>
            
                <div class="doctor-table-card">
            
                    <table class="doctor-table">
            
                        <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Department</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
            
                        <tbody id="appointmentTableBody">

                        </tbody>
            
                    </table>
            
                </div>
            
            </section>

        </main>
    </div>

    <script src="../../config.js"></script>
    <script src="../../utils/html.js"></script>
    <script src="../../confirm-toast/confirm.js"></script>
    <script src="../../confirm-toast/toast.js"></script>
    <script src="../admin-session.js"></script>
    <script src="../admin-shell.js"></script>
    <script src="admin-appointments.js"></script>
</body>
</html>
